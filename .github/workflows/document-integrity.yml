name: Document and trace integrity
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run test:traceability
      - run: npm run docs:check:strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trace-check-report
          path: docs/traceability/reports/
