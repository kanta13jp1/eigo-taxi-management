<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>認証終了・再試行の限定検証</title></head>
<body>
  <main>
    <h1>認証終了・再試行の限定検証</h1>
    <p>これはローカル専用の検証画面です。Googleの実認証とFirebase SDKを使い、SDKの公式フックでログアウトを1回だけ人工的に失敗させます。実サービスの障害や、以前のiPhoneのエラーを再現する試験ではありません。</p>
    <p>検証用の会社Googleアカウントをご本人が選択してください。確認コード・パスワードはこの画面に入力しません。台帳・カレンダーにはアクセスしません。</p>
    <p id="state" role="status" aria-live="polite">準備中です。</p>
    <p id="instruction"></p>
    <div id="buttons">
      <button id="login" type="button" disabled>Googleで本人認証</button>
      <button id="arm" type="button" disabled>人工的な1回の失敗を設定</button>
      <button id="logout" type="button" disabled>ログアウトを試す</button>
      <button id="retry" type="button" disabled>終了処理を再試行</button>
      <button id="cleanup" type="button" disabled>通常ログアウトして終了</button>
    </div>
    <p>作業中に中止する場合は、通常ログアウトを試み、この専用タブを閉じてください。専用ブラウザープロファイルでの使用を推奨します。</p>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
